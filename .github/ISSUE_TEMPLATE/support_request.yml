name: Support request
description: Ask for help with a reproducible local Rubric Studio Open workflow.
title: "[Support]: "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues are for reproducible OSS support cases. Do not post
        API keys, private rubrics, private samples, customer data, local paths,
        hostnames, or security vulnerabilities.
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - Install or local development
        - Open/import project
        - Author criteria
        - Preview/live testing
        - Calibration
        - Diff/versioning
        - Export adapter
        - AuraOne intake export
        - Browser edition
        - VS Code extension
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What did you try?
      description: Include commands and public sample data only.
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: What is blocking you?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, private samples, proprietary rubrics, local paths, hostnames, and confidential content.
          required: true
