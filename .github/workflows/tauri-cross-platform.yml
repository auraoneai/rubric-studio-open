name: Rubric Studio Open Tauri

on:
  workflow_dispatch:
    inputs:
      run_native_e2e:
        description: Run native Tauri WebDriver e2e on the supported Windows runner
        required: false
        type: boolean
        default: false
  pull_request: {}
  push:
    branches:
      - main

jobs:
  tauri-shell:
    name: Tauri shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUN_TAURI_NATIVE_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_e2e && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux WebKit dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install matching Microsoft Edge driver
        if: matrix.os == 'windows-latest'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH

      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser test runtime
        run: pnpm exec playwright install chromium

      - name: Verify native e2e preflight
        run: pnpm tauri:e2e:preflight

      - name: Typecheck
        run: pnpm typecheck

      - name: Product surface tests
        run: pnpm test:product

      - name: Tauri Rust tests
        run: pnpm tauri:core:test

      - name: Build Tauri shell
        run: pnpm tauri:build:ci

      - name: Native Tauri e2e
        if: matrix.os == 'windows-latest' && env.RUN_TAURI_NATIVE_E2E == '1'
        run: pnpm tauri:e2e
