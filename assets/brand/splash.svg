    text-anchor="middle"
  >a</text>
  <text x="960" y="622" fill="#191512" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="400" text-anchor="middle">AuraOne · Rubric Studio</text>
  <text x="960" y="674" fill="#5f5a55" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="400" text-anchor="middle">Local-first rubric IDE</text>
</svg>
