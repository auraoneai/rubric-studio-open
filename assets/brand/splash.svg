<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Rubric Studio Open splash screen</title>
  <desc id="desc">A light launch splash for Rubric Studio Open with the AuraOne mark.</desc>
  <rect width="1920" height="1080" fill="#f7f7f4"/>
  <rect x="860" y="314" width="200" height="200" rx="44" fill="#17110f"/>
  <text
    x="960"
    y="450"
    fill="#fff9ef"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="118"
    font-style="italic"
