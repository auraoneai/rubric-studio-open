<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rubric Studio Open is a local-first IDE for criterion-level evaluation rubrics."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Rubric Studio Open</title>
    <style>
      .boot-splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #061113;
        color: #e8fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-splash__mark {
        width: 76px;
        height: 76px;
        margin: 0 auto 18px;
        overflow: hidden;
        border-radius: 18px;
        background: #071519;
        display: grid;
        place-items: center;
      }

      .boot-splash p {
        margin: 0;
        color: #8daeb6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <div>
          <div class="boot-splash__mark" aria-hidden="true">
            <img src="/icon-192.png" alt="" width="76" height="76" />
          </div>
          <p>Loading Rubric Studio Open...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
