<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rubric Studio Open is a local-first IDE for criterion-level evaluation rubrics."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Rubric Studio Open</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f4f6fb;
      }

      .boot-splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6fb;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .boot-splash > div {
        text-align: center;
      }

      .boot-splash__mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        background: url("/favicon.svg") center / contain no-repeat;
        border-radius: 16px;
      }

      .boot-splash__title {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 700;
        color: #0b1220;
        letter-spacing: -0.005em;
      }

      .boot-splash p {
        margin: 0;
        font-size: 13px;
        color: #5b6b80;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        .boot-splash {
          background: #0c121b;
          color: #e5eef7;
        }

        .boot-splash__title {
          color: #f8fafc;
        }

        .boot-splash p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <div>
          <div class="boot-splash__mark" aria-hidden="true"></div>
          <p class="boot-splash__title">Rubric Studio Open</p>
          <p>Loading the local-first rubric IDE...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
