[package]
name = "rubric-studio-open-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
tauri-runtime = ["tauri", "tauri-plugin-deep-link", "tauri-plugin-dialog", "tauri-plugin-updater"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.8"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-deep-link = { version = "2.4.9", optional = true }
tauri-plugin-dialog = { version = "2.4.0", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "rubric_studio_open_core"
path = "src/lib.rs"

[[bin]]
name = "rubric-studio-open"
path = "src/main.rs"
