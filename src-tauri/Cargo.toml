[package]
name = "rubric-studio-open-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
tauri-runtime = ["tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tauri = { version = "2", optional = true }

[lib]
name = "rubric_studio_open_core"
path = "src/lib.rs"

[[bin]]
name = "rubric-studio-open"
path = "src/main.rs"
